<section class="auth container">
  <div class="auth__panel card">
    <span class="eyebrow">Welcome back</span>
    <h1>Log in</h1>

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth__form">
      <label>
        Email
        <input type="email" formControlName="email" autocomplete="email" />
      </label>
      <label>
        Password
        <input type="password" formControlName="password" autocomplete="current-password" />
      </label>

      @if (error()) {
        <p class="auth__error">{{ error() }}</p>
      }

      <button type="submit" class="btn btn--primary" [disabled]="form.invalid || submitting()">
        {{ submitting() ? 'Charting course...' : 'Log in' }}
      </button>
    </form>

    <p class="auth__switch">New to the fleet? <a routerLink="/signup">Set sail</a></p>
  </div>
</section>
