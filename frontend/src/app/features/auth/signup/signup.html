<section class="auth container">
  <div class="auth__panel card">
    <span class="eyebrow">Join the fleet</span>
    <h1>Set sail</h1>

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth__form">
      <label>
        Name
        <input type="text" formControlName="name" autocomplete="name" />
      </label>
      <label>
        Email
        <input type="email" formControlName="email" autocomplete="email" />
      </label>
      <label>
        Password
        <input type="password" formControlName="password" autocomplete="new-password" />
      </label>

      @if (error()) {
        <p class="auth__error">{{ error() }}</p>
      }

      <button type="submit" class="btn btn--primary" [disabled]="form.invalid || submitting()">
        {{ submitting() ? 'Registering...' : 'Create account' }}
      </button>
    </form>

    <p class="auth__switch">Already sailing with us? <a routerLink="/login">Log in</a></p>
  </div>
</section>
