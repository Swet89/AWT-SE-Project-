<section class="crew container">
  <span class="eyebrow">The Crew</span>
  <h1>Who built this ship</h1>
  <p class="crew__intro">A small band of developers, same as any good crew — few in number, loud in spirit.</p>

  <div class="crew__grid">
    @for (person of crew; track person.name) {
      <div class="crew__card card">
        <div class="crew__avatar">{{ person.initials }}</div>
        <h3>{{ person.name }}</h3>
        <p class="crew__role">{{ person.role }}</p>
        <p class="crew__epithet">"{{ person.epithet }}"</p>
      </div>
    }
  </div>
</section>
