<header class="nav">
  <div class="nav__inner">
    <a routerLink="/" class="nav__brand" (click)="closeMenu()">
      <span class="nav__brand-mark">Ω</span>
      <span class="nav__brand-text">ODYSSEY</span>
    </a>

    <button
      class="nav__burger"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen"
      aria-label="Toggle navigation"
    >
      <span></span><span></span><span></span>
    </button>

    <nav class="nav__links" [class.nav__links--open]="menuOpen">
      <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">Voyage</a>
      <a routerLink="/game" routerLinkActive="is-active" (click)="closeMenu()">Contest of the Bow</a>
      <a routerLink="/dev-team" routerLinkActive="is-active" (click)="closeMenu()">The Crew</a>

      @if (auth.isLoggedIn()) {
        <span class="nav__user">Ahoy, {{ auth.user()?.name }}</span>
        <button type="button" class="nav__link-btn" (click)="logout()">Log out</button>
      } @else {
        <a routerLink="/login" routerLinkActive="is-active" (click)="closeMenu()">Log in</a>
        <a routerLink="/signup" class="nav__cta" (click)="closeMenu()">Set sail</a>
      }

      <button
        type="button"
        class="nav__theme-toggle"
        (click)="theme.toggle()"
        [attr.aria-pressed]="theme.isDark()"
        aria-label="Toggle dark mode"
        title="Toggle day / night"
      >
        {{ theme.isDark() ? '☾' : '☀' }}
      </button>
    </nav>
  </div>
</header>
